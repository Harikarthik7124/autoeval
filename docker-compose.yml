version: "3.9"

services:

  postgres:
    image: ankane/pgvector
    container_name: autoeval-postgres
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: autoeval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: autoeval-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:pass@postgres:5432/autoeval
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  frontend:
    image: node:20-alpine
    container_name: autoeval-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

volumes:
  postgres_data: